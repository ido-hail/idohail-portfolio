name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Each quality gate runs as its own step (rather than one
      # `npm run verify` step) so a failure is visible per-gate in the
      # GitHub Actions UI. The gates themselves stay defined once, in
      # package.json — this only orchestrates them separately.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Astro/TypeScript check
        run: npm run check

      # The one and only production build. Both link-check passes and the
      # uploaded artifact operate on this exact dist/ — nothing rebuilds
      # after this step.
      - name: Build
        run: npm run build

      # Internal links: blocking. --offline makes zero network requests,
      # so this can't be flaky; --root-dir resolves root-relative hrefs
      # (e.g. /about/) against the built dist/ output.
      - name: Check internal links (blocking)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --root-dir ./dist
            --no-progress
            './dist/**/*.html'
            './dist/**/*.xml'
          fail: true
          token: ""

      # External links: best effort. Network-enabled, so a flaky/slow
      # third party (e.g. github.com) must not fail CI. The production
      # custom domain is live, so the site's own canonical/OG self-links
      # to idohail.com are checked like any other external link.
      - name: Check external links (best effort)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        continue-on-error: true
        with:
          args: >-
            --root-dir ./dist
            --no-progress
            './dist/**/*.html'
          fail: true
          failIfEmpty: false
          token: ""

      # Uploaded once per commit under a SHA-scoped name so a future
      # Preview/Production job in this SAME workflow run (needs: validate)
      # can download this exact validated dist/ without rebuilding.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 3

  preview:
    name: Preview
    needs: validate
    # Only same-repo PRs targeting main (the pull_request trigger above
    # already restricts the base branch). Fork PRs are excluded because
    # their head repo differs from this one, so Cloudflare credentials
    # are never reachable from a fork's workflow run. Dependabot PRs are
    # excluded explicitly by PR author, since Dependabot opens PRs from
    # branches inside this same repository (not a fork), so the fork
    # check alone would not exclude them.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # npm ci here is only to obtain the repo-pinned wrangler binary
      # (a devDependency) and read wrangler.jsonc — dist/ is not rebuilt.
      - name: Install dependencies
        run: npm ci

      # Restores the exact artifact validate produced, directly into
      # ./dist (upload-artifact archived dist/'s contents, not the
      # folder itself, so download-artifact's `path` lands them here
      # unnested) — matching wrangler.jsonc's assets.directory.
      - name: Download validated dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: ./dist

      # versions upload only creates a new Worker version + Preview URL.
      # It never promotes traffic, attaches routes/domains, or touches
      # DNS. Structured output is written to WRANGLER_OUTPUT_FILE_PATH
      # (NDJSON) instead of being parsed from human-readable stdout;
      # that path lives under runner.temp, not the repo workspace, so
      # it can never end up inside dist/ or the uploaded artifact.
      - name: Upload Cloudflare Worker version (preview)
        id: wrangler_upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler versions upload \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.sha }}" \
            --tag "pr-${{ github.event.pull_request.number }}"

          # Parse only Wrangler's own structured NDJSON output. Take the
          # most recent version-upload object with a non-empty
          # preview_url. Never construct/guess a URL from the Worker
          # name or version ID. Uses the already-installed Node 24
          # runtime — no jq, no extra dependency.
          PREVIEW_URL=$(node -e '
            const fs = require("node:fs");
            const path = process.env.WRANGLER_OUTPUT_FILE_PATH;
            let found = "";
            try {
              const lines = fs.readFileSync(path, "utf8").split("\n").filter(Boolean);
              for (const line of lines) {
                let obj;
                try {
                  obj = JSON.parse(line);
                } catch {
                  continue;
                }
                if (obj && obj.type === "version-upload" && obj.preview_url) {
                  found = obj.preview_url;
                }
              }
            } catch {}
            process.stdout.write(found);
          ')

          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::wrangler versions upload did not report a version-upload object with preview_url in WRANGLER_OUTPUT_FILE_PATH"
            exit 1
          fi

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish preview URL to job summary
        run: |
          {
            echo "### Cloudflare Preview"
            echo "🔗 ${{ steps.wrangler_upload.outputs.preview_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production
    needs: validate
    # Explicit guard even though the workflow-level push trigger already
    # restricts this to main — production is the highest-stakes job here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    # Serialize production runs. A running job is never cancelled; if
    # multiple pushes queue up, only the newest pending one survives
    # (GitHub's default concurrency-group behavior) — final state always
    # converges on the latest main commit, intermediate ones may be
    # skipped entirely, which is acceptable here.
    concurrency:
      group: production
      cancel-in-progress: false
    # contents: read only. Referencing `environment:` records this run
    # in the environment's deployment history automatically, regardless
    # of token permissions — deployments: write would only be needed if
    # this workflow called the Deployments REST API directly, which it
    # does not. actions: read is not needed either: contents: read alone
    # already proved sufficient for same-run download-artifact in the
    # preview job's real executed run.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # npm ci here is only to obtain the repo-pinned wrangler binary
      # (a devDependency) and read wrangler.jsonc — dist/ is not rebuilt.
      - name: Install dependencies
        run: npm ci

      # Restores the exact artifact validate produced for this exact
      # commit, directly into ./dist — matching wrangler.jsonc's
      # assets.directory. No Astro rebuild.
      - name: Download validated dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: ./dist

      # Uploads a new Worker version from the validated artifact. This
      # alone does not shift any production traffic. The Node script
      # itself validates and fails closed — no eval, no shell
      # round-tripping of Wrangler's output. Both version_id and
      # preview_url are required from the structured "version-upload"
      # object — never constructed. preview_url is needed for
      # post-production smoke testing, since preview_urls=true remains
      # active for every version regardless of its production traffic
      # status.
      - name: Upload Cloudflare Worker version (production)
        id: wrangler_upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          npx wrangler versions upload \
            --message "main @ ${{ github.sha }}" \
            --tag "main-${{ github.sha }}"

          # A quoted heredoc delimiter ('NODE_SCRIPT') means Bash treats
          # everything up to the closing NODE_SCRIPT line as fully
          # literal text — no quote/backtick/expansion parsing at all —
          # so JavaScript comments and strings below may safely contain
          # apostrophes, double quotes, or backticks without risking the
          # kind of shell-quoting break a single-quoted `node -e '...'`
          # string is vulnerable to.
          node <<'NODE_SCRIPT'
          const fs = require("node:fs");
          const outputPath = process.env.WRANGLER_OUTPUT_FILE_PATH;
          const githubOutputPath = process.env.GITHUB_OUTPUT;
          // Track the single latest version-upload object as a whole,
          // not its fields independently — fields must both come from
          // the SAME record, never combined across different records.
          let latest = null;
          try {
            const lines = fs.readFileSync(outputPath, "utf8").split("\n").filter(Boolean);
            for (const line of lines) {
              let obj;
              try {
                obj = JSON.parse(line);
              } catch {
                continue;
              }
              if (obj && obj.type === "version-upload") {
                latest = obj;
              }
            }
          } catch {}

          const versionId = latest && latest.version_id ? latest.version_id : "";
          const previewUrl = latest && latest.preview_url ? latest.preview_url : "";

          if (!versionId) {
            console.log("::error::wrangler versions upload did not report a version_id in the latest version-upload record in WRANGLER_OUTPUT_FILE_PATH");
            process.exit(1);
          }
          if (!previewUrl) {
            console.log("::error::wrangler versions upload did not report a preview_url in the latest version-upload record in WRANGLER_OUTPUT_FILE_PATH");
            process.exit(1);
          }

          fs.appendFileSync(githubOutputPath, `version_id=${versionId}\n`);
          fs.appendFileSync(githubOutputPath, `preview_url=${previewUrl}\n`);
          NODE_SCRIPT

      # Explicitly promotes the exact version just uploaded to 100% of
      # production traffic, using the flag form (not shorthand). --version-id
      # + --percentage together already force non-interactive prompt
      # defaults in Wrangler's own handler logic; --yes is passed too for
      # explicit clarity. versions deploy has no route/domain/trigger
      # flags at all — structurally incapable of touching routes, DNS,
      # or custom domains.
      #
      # The wrangler exit code is captured explicitly (set +e / set -e)
      # rather than relying on the shell's default -e, so this step can
      # still report state on any failure mode before failing. A
      # non-zero exit code does NOT prove the remote Cloudflare
      # deployment was not created — a server-side promotion may
      # theoretically have occurred before a transport/client failure
      # was observed — so that case is reported as unknown/unverified
      # state, never as "not promoted". No retry, no auto-promote, no
      # auto-rollback in either failure case.
      - name: Promote version to production (100%)
        id: wrangler_promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          set +e
          npx wrangler versions deploy \
            --version-id "${{ steps.wrangler_upload.outputs.version_id }}" \
            --percentage 100 \
            --message "main @ ${{ github.sha }}" \
            --yes
          DEPLOY_EXIT_CODE=$?
          set -e

          if [ "$DEPLOY_EXIT_CODE" -ne 0 ]; then
            {
              echo "### Cloudflare Production Deployment — PROMOTION COMMAND FAILED"
              echo "- Commit: \`${{ github.sha }}\`"
              echo "- Worker: \`idohail-portfolio\`"
              echo "- Version ID (uploaded): \`${{ steps.wrangler_upload.outputs.version_id }}\`"
              echo "- Version Preview URL (uploaded version): ${{ steps.wrangler_upload.outputs.preview_url }}"
              echo "- wrangler versions deploy exit code: $DEPLOY_EXIT_CODE"
              echo "- Status: promotion command failed; remote Cloudflare deployment state is unverified. Inspect deployment history before taking further action."
              echo ""
              echo "Run \`npx wrangler deployments list\` or check the Cloudflare dashboard to determine the actual remote state before taking any further action."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::wrangler versions deploy exited $DEPLOY_EXIT_CODE. Remote Cloudflare deployment state is UNKNOWN/UNVERIFIED — a non-zero exit code does not prove the promotion did not occur server-side. Version ${{ steps.wrangler_upload.outputs.version_id }} was uploaded. Inspect 'npx wrangler deployments list' or the Cloudflare dashboard before taking further action. Not retrying, not auto-promoting, not rolling back."
            exit 1
          fi

          # Parse only the labeled structured field. deployment_id is an
          # officially-emitted field for a successful version-deploy —
          # its absence after a zero exit code is treated as an error,
          # not best-effort: Cloudflare may already have applied the
          # deployment even though we can't confirm its ID here.
          #
          # Quoted heredoc, same reasoning as the upload step above: the
          # JavaScript comment below deliberately contains an apostrophe
          # ("record's") — the exact pattern that broke the previous
          # single-quoted `node -e '...'` form in production — to prove
          # this construct tolerates it. The script writes deployment_id
          # to GITHUB_OUTPUT itself and exits non-zero if it can't find
          # one, so the shell branches on a real exit code rather than
          # inspecting a captured string.
          set +e
          node <<'NODE_SCRIPT'
          const fs = require("node:fs");
          const path = process.env.WRANGLER_OUTPUT_FILE_PATH;
          const githubOutputPath = process.env.GITHUB_OUTPUT;
          // Track the single latest version-deploy object as a whole.
          // If that latest record lacks deployment_id, this must fail
          // closed — never fall back to an older record's deployment_id.
          let latest = null;
          try {
            const lines = fs.readFileSync(path, "utf8").split("\n").filter(Boolean);
            for (const line of lines) {
              let obj;
              try {
                obj = JSON.parse(line);
              } catch {
                continue;
              }
              if (obj && obj.type === "version-deploy") {
                latest = obj;
              }
            }
          } catch {}

          const deploymentId = latest && latest.deployment_id ? latest.deployment_id : "";

          if (!deploymentId) {
            process.exit(1);
          }

          fs.appendFileSync(githubOutputPath, `deployment_id=${deploymentId}\n`);
          NODE_SCRIPT
          PARSE_EXIT_CODE=$?
          set -e

          if [ "$PARSE_EXIT_CODE" -ne 0 ]; then
            {
              echo "### Cloudflare Production Deployment — AMBIGUOUS STATE"
              echo "- Commit: \`${{ github.sha }}\`"
              echo "- Worker: \`idohail-portfolio\`"
              echo "- Version ID: \`${{ steps.wrangler_upload.outputs.version_id }}\`"
              echo "- Version Preview URL: ${{ steps.wrangler_upload.outputs.preview_url }}"
              echo "- Status: wrangler versions deploy exited 0, but no version-deploy object with a deployment_id was found in structured output. Cloudflare may already have created the deployment — verify manually before taking any action."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::wrangler versions deploy exited 0 but WRANGLER_OUTPUT_FILE_PATH did not contain a version-deploy object with a non-empty deployment_id. Cloudflare may already have applied this deployment — verify manually (dashboard or 'wrangler deployments list') before taking further action. Not automatically re-promoting."
            exit 1
          fi

      - name: Publish production deployment summary
        run: |
          {
            echo "### Cloudflare Production Deployment"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Worker: \`idohail-portfolio\`"
            echo "- Version ID: \`${{ steps.wrangler_upload.outputs.version_id }}\`"
            echo "- Deployment ID: \`${{ steps.wrangler_promote.outputs.deployment_id }}\`"
            echo "- Version Preview URL (verification only): ${{ steps.wrangler_upload.outputs.preview_url }}"
            echo "- Status: promoted to 100%"
            echo ""
            echo "_Production: https://idohail.com — the Preview URL above is for verification only, not the GitHub environment URL._"
          } >> "$GITHUB_STEP_SUMMARY"
